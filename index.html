<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yora's playlist</title>
  <style>
    :root {
      --bg: #e4e4e4;
      --ink: #222;
      --panel-bg: #fafafa;

      --drawer-w: clamp(340px, 34vw, 540px);
      --tab-w: 11rem;
      --tab-h: 4rem;
      --tab-gap: 0.75rem;
      --rail-top: 6rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      transition: background-color 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }

    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
      transition: padding-right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-layout.drawer-open {
      padding-right: calc(var(--drawer-w) + var(--tab-w) + 1.5rem);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    #note {
      font-size: 4rem;
      line-height: 1;
      color: #000;
      user-select: none;
      will-change: transform;
    }

    #sentence-display {
      min-height: 3rem;
      max-width: 460px;
      margin-top: 0.75rem;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 400;
      color: rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #sentence-display.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 1rem;
      justify-content: center;
    }

    .cell {
      --size: 150px;
      --pad: 28px;
      padding: var(--pad);
      border: none;
      background: none;
      border-radius: 50%;
      cursor: pointer;
      font: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .node {
      position: relative;
      display: block;
      width: var(--size);
      height: var(--size);
      will-change: transform;
    }

    .ring {
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--c) 22%, white);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .disc {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--c);
      color: #fff;
      will-change: transform;
      font-size: 1.1rem;
      font-weight: 400;
      text-transform: lowercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .cell.active .disc { font-weight: 700; }

    .slide-drawer {
      position: fixed;
      top: 50%;
      right: calc(-1 * (var(--drawer-w) + 3rem));
      transform: translateY(-50%);
      width: var(--drawer-w);
      min-height: max(25rem, calc(var(--rail-top) + var(--tab-count, 1) * (var(--tab-h) + var(--tab-gap)) + 2.25rem));
      max-height: 90vh;
      background: var(--panel-bg);
      color: var(--ink);
      border-radius: 72px 0 0 72px;
      box-shadow: -12px 0 48px rgba(0, 0, 0, 0.08);
      padding: 2.75rem 2.5rem 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: visible;
      transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1), min-height 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-drawer.open { right: 0; }

    .drawer-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.75rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    }

    #drawer-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      text-transform: lowercase;
    }

    #drawer-body {
      font-size: 1.2rem;
      line-height: 1.5;
      color: #333;
      max-width: 22em;
    }

    .player {
      flex-shrink: 0;
      width: 100%;
      padding-top: 1.25rem;
      --seek-color: #555;
      --pct: 0%;
      --vol-pct: 85%;
    }

    .play-btn {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 1.1rem;
      border: none;
      border-radius: 50%;
      background: var(--seek-color);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.3s ease;
    }

    .play-btn:hover:not(:disabled) { transform: scale(1.07); }
    .play-btn:active:not(:disabled) { transform: scale(0.96); }
    .play-btn:disabled { opacity: 0.35; cursor: default; }

    .play-btn svg { width: 28px; height: 28px; fill: currentColor; grid-area: 1 / 1; }
    .play-btn .icon-play { display: none; transform: translateX(2px); }
    .play-btn.is-paused .icon-play { display: block; }
    .play-btn.is-paused .icon-pause { display: none; }

    #seek, #volume {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 20px;
      margin: 0;
      background: transparent;
      outline: none;
      cursor: pointer;
    }

    #seek::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--pct), rgba(0, 0, 0, 0.12) var(--pct));
    }
    #seek::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--pct), rgba(0, 0, 0, 0.12) var(--pct));
    }

    #seek::-webkit-slider-thumb, #volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--seek-color);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    #seek::-moz-range-thumb, #volume::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--seek-color);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.85rem;
    }

    .volume-container svg {
      width: 18px;
      height: 18px;
      fill: #555;
      flex-shrink: 0;
    }

    #volume::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--vol-pct), rgba(0, 0, 0, 0.12) var(--vol-pct));
    }
    #volume::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--vol-pct), rgba(0, 0, 0, 0.12) var(--vol-pct));
    }

    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      color: #555;
    }

    .player.empty .times, .player.empty .volume-container { opacity: 0.4; }

    #close-drawer {
      position: absolute;
      top: 1.5rem;
      right: 1.75rem;
      width: 2.25rem;
      height: 2.25rem;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.06);
      color: #444;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #close-drawer:hover { background: rgba(0, 0, 0, 0.12); }

    .bookmark-list {
      position: absolute;
      top: var(--rail-top);
      right: calc(100% - 2px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--tab-gap);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .slide-drawer.open .bookmark-list {
      opacity: 1;
      pointer-events: auto;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 6rem;
      max-width: 15rem;
      height: var(--tab-h);
      padding: 0 1.4rem 0 1.5rem;
      background: var(--panel-bg);
      border: 2px solid transparent;
      border-right: none;
      border-radius: 32px 0 0 32px;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.15;
      text-align: right;
      text-transform: lowercase;
      cursor: pointer;
      outline: none;
      transition: padding-left 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease;
    }

    .bookmark-item:hover,
    .bookmark-item:focus-visible,
    .bookmark-item.selected {
      font-weight: 700;
      border-color: color-mix(in srgb, var(--accent) 55%, #555);
    }

    .bookmark-item:hover,
    .bookmark-item:focus-visible {
      padding-left: 2.1rem;
    }

    .bookmark-item .label::after {
      content: attr(data-label);
      display: block;
      height: 0;
      overflow: hidden;
      visibility: hidden;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      :root { --drawer-w: 80vw; }
      .app-layout.drawer-open { padding-right: 0; }
      .slide-drawer { border-radius: 48px 0 0 48px; padding-left: 2.25rem; }
    }
  </style>
</head>
<body>

  <div class="app-layout" id="app-layout">
    <div class="main-content">
      <div class="hero">
        <div id="note" aria-hidden="true">♫</div>
        <div id="sentence-display" aria-live="polite"></div>
      </div>
      <main class="button-grid" id="button-container"></main>
    </div>

    <aside class="slide-drawer" id="slide-drawer" aria-label="Details">
      <div class="bookmark-list" id="bookmark-container"></div>
      <button id="close-drawer" aria-label="Close panel">×</button>

      <div class="drawer-scroll">
        <h2 id="drawer-title"></h2>
        <p id="drawer-body"></p>
      </div>

      <div class="player empty" id="player">
        <button class="play-btn" id="play-toggle" aria-label="Pause" disabled>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="5" width="4.2" height="14" rx="1.2" />
            <rect x="13.8" y="5" width="4.2" height="14" rx="1.2" />
          </svg>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
          </svg>
        </button>
        <input type="range" id="seek" min="0" max="0" step="any" value="0" disabled aria-label="Song position" />
        <div class="times">
          <span id="time-now">0:00</span>
          <span id="time-total">0:00</span>
        </div>
        <div class="volume-container">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" disabled aria-label="Volume level" />
        </div>
      </div>
    </aside>
  </div>

  <script>
    const ITEMS = [
      {
        id: "happy",
        label: "happy",
        color: "#ddd2a3",
        sentence: "Is there a moment anymore perfect than this?",
        audio: "",
        detailsTitle: "Yora's happiest moment",

        bookmarks: [
          {

        ]
      },
      {
        id: "sad",
        label: "sad",
        color: "#8fa8d4",
        sentence: "at least she's rich",
        audio: "",
        detailsTitle: "yora's saddest moments",
        detailsText: "collection of songs i would imagine playing while yora realizes this shit isn't unicorns and rainbows!",
        bookmarks: [
          {
            id: "sad-sub-1",
            label: "Tragedy",
            color: "#7f93b0",
            sentence: "rich people have feelings too!",
            audio: "/audio/openingtheme.mp3",
            title: "Yora's saddest moments",
            text: "Yora just stumbled upon the dead bodies of all of her friends. this sucks...\n LOWK just skip to 1:16 for the most bang 4 ur buck"
          }
        ]
      },
      {
        id: "default",
        label: "default",
        color: "#888888",
        sentence: "looms over her like a rainy cloud, or the sun. either way",
        audio: "",
        detailsTitle: "yora's default state",
        detailsText: "collection of songs that are integral to Yora's character no matter the situation",
        bookmarks: [
          {
            id: "default-sub-1",
            label: "reflecting",
            color: "#a9a9a9",
            sentence: "growing up lonely really changes you, doesn't it?",
            audio: "/audio/SABBATH.mp3",
            title: "yora's default state",
            text: "i play this everytime i need to write something reflective for Yora. it just so happens that shes reflecting ALL the time."
          }
        ]
      },
      {
        id: "battle",
        label: "battle",
        color: "#b05a56",
        sentence: "let's make al qaeda look like a birthday party!",
        audio: "",
        detailsTitle: "Tag, you're it!",
        detailsText: "a collection of songs i'd imagine Yora in battle to, in which she dies everytime in all of them",
        bookmarks: [
          {
            id: "battle-sub-1",
            label: "Explosion",
            color: "#c9736b",
            sentence: "If only she was a better student...",
            audio: "/audio/Five.mp3",
            title: "Tag, you're it!",
            text: "The wind just blew through her hair as she stares down are her opponent... this is their big day. THEY'RE ABOUT TO CATCH THEIR FIRST BODY!"
          }
        ]
      }
    ];

    const BASE_BG = "#e4e4e4";
    const appLayout = document.getElementById("app-layout");
    const container = document.getElementById("button-container");
    const sentenceEl = document.getElementById("sentence-display");
    const noteEl = document.getElementById("note");
    const drawer = document.getElementById("slide-drawer");
    const drawerTitle = document.getElementById("drawer-title");
    const drawerBody = document.getElementById("drawer-body");
    const bookmarkContainer = document.getElementById("bookmark-container");
    const closeDrawerBtn = document.getElementById("close-drawer");
    const playerEl = document.getElementById("player");
    const seek = document.getElementById("seek");
    const volumeSlider = document.getElementById("volume");
    const timeNow = document.getElementById("time-now");
    const timeTotal = document.getElementById("time-total");
    const playBtn = document.getElementById("play-toggle");

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SPIN = reduceMotion ? 0 : 1;
    const TAU = Math.PI * 2;
    const BOUNCE = reduceMotion ? 0 : 0.65;

    drawer.inert = true;

    let selectedItem = null;
    let selectedTab = null;
    let hover = null;
    let userPaused = false;
    let currentVolume = 0.85;
    const randomHoverCache = new Map();

    const tint = (c) => `color-mix(in srgb, ${c} 28%, ${BASE_BG})`;

    function resolveTarget() {
      if (hover) return hover;
      if (selectedTab) return { src: selectedTab, owner: selectedItem };
      if (selectedItem) return { src: selectedItem, owner: selectedItem };
      return null;
    }

    const tracks = new Map();
    let currentTrack = null;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function getTrack(url) {
      if (!url) return null;
      if (tracks.has(url)) return tracks.get(url);

      const el = new Audio();
      if (/^https?:\/\//i.test(url)) {
        el.crossOrigin = "anonymous";
      }
      el.loop = false; // Disabled native loop so 'ended' event can catch track completion
      el.volume = 0;
      el.preload = "auto";
      el.src = url;

      // Automatically advance to the next bookmark when current song ends
      el.addEventListener("ended", () => {
        if (!selectedItem || !selectedItem.bookmarks || selectedItem.bookmarks.length === 0) return;
        
        let currentIndex = 0;
        if (selectedTab) {
          currentIndex = selectedItem.bookmarks.indexOf(selectedTab);
        }
        
        const nextIndex = (currentIndex + 1) % selectedItem.bookmarks.length;
        const nextBm = selectedItem.bookmarks[nextIndex];
        
        selectedTab = nextBm;
        setPanelText(nextBm.title, nextBm.text || nextBm.sentence);
        
        const bookmarkButtons = bookmarkContainer.querySelectorAll(".bookmark-item");
        bookmarkButtons.forEach((b, idx) => {
          b.classList.toggle("selected", idx === nextIndex);
        });
        
        apply();
      });

      const track = { el, analyser: null, timeData: null, freqData: null, connected: false };
      tracks.set(url, track);
      return track;
    }

    function ensureAnalyser(track) {
      if (!track || track.connected) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const source = ctx.createMediaElementSource(track.el);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.15;
        source.connect(analyser);
        analyser.connect(ctx.destination);
        track.analyser = analyser;
        track.timeData = new Uint8Array(analyser.fftSize);
        track.freqData = new Uint8Array(analyser.frequencyBinCount);
        track.connected = true;
      } catch (e) {
        track.connected = true;
      }
    }

    function fadeAudio(audio, targetVolume, duration = 250) {
      if (!audio) return;
      clearInterval(audio._fadeInterval);

      const finalTarget = userPaused ? 0 : targetVolume;
      const steps = 12;
      const stepTime = duration / steps;
      const volumeStep = (finalTarget - audio.volume) / steps;

      if (finalTarget > 0 && audio.paused) {
        audio.play().catch(() => {});
      }

      audio._fadeInterval = setInterval(() => {
        const nextVol = Math.min(1, Math.max(0, audio.volume + volumeStep));
        audio.volume = nextVol;

        if (Math.abs(finalTarget - nextVol) < 0.03) {
          audio.volume = finalTarget;
          clearInterval(audio._fadeInterval);
          if (finalTarget === 0) {
            audio.pause();
            if (!selectedItem) audio.currentTime = 0;
          }
        }
      }, stepTime);
    }

    function setTrack(track) {
      if (track === currentTrack) {
        if (track) ensureAnalyser(track);
        return;
      }
      tracks.forEach((t) => { if (t !== track) fadeAudio(t.el, 0, 250); });
      currentTrack = track;
      if (track) {
        ensureAnalyser(track);
        if (!userPaused) fadeAudio(track.el, currentVolume, 250);
      }
    }

    function unlockAudio() {
      getAudioContext();
      if (currentTrack) {
        ensureAnalyser(currentTrack);
        if (currentTrack.el.paused && !userPaused) {
          fadeAudio(currentTrack.el, currentVolume, 250);
        }
      }
    }
    window.addEventListener("pointerdown", unlockAudio, { passive: true });
    window.addEventListener("keydown", unlockAudio, { passive: true });

    const nodes = [];

    function apply() {
      const t = resolveTarget();
      document.body.style.backgroundColor = t ? tint(t.src.color) : BASE_BG;

      if (t) {
        sentenceEl.textContent = t.src.sentence;
        sentenceEl.classList.add("visible");
      } else {
        sentenceEl.classList.remove("visible");
      }

      nodes.forEach((n) => {
        n.active = !!t && t.owner === n.item;
        n.cell.classList.toggle("active", n.active);
      });

      if (t) playerEl.style.setProperty("--seek-color", `color-mix(in srgb, ${t.src.color} 55%, #555)`);
      
      const newTrack = t ? getTrack(t.src.audio) : null;
      setTrack(newTrack);
    }

    let scrubbing = false;
    let lastDuration = -1;

    function fmtTime(s) {
      s = Math.max(0, Math.floor(s || 0));
      const m = Math.floor(s / 60);
      const sec = String(s % 60).padStart(2, "0");
      return `${m}:${sec}`;
    }

    seek.addEventListener("input", () => {
      scrubbing = true;
      const t = parseFloat(seek.value);
      timeNow.textContent = fmtTime(t);
      if (currentTrack) currentTrack.el.currentTime = t;
    });
    seek.addEventListener("change", () => { scrubbing = false; });
    window.addEventListener("pointerup", () => { scrubbing = false; });

    volumeSlider.addEventListener("input", (e) => {
      currentVolume = parseFloat(e.target.value);
      if (currentTrack && !userPaused) {
        currentTrack.el.volume = currentVolume;
      }
      const pct = (currentVolume * 100).toFixed(0) + "%";
      playerEl.style.setProperty("--vol-pct", pct);
    });

    function syncPlayButton() {
      playBtn.classList.toggle("is-paused", userPaused);
      playBtn.setAttribute("aria-label", userPaused ? "Play" : "Pause");
    }

    function setPaused(p) {
      userPaused = p;
      syncPlayButton();
      if (currentTrack) fadeAudio(currentTrack.el, p ? 0 : currentVolume, p ? 200 : 250);
    }

    playBtn.addEventListener("click", () => {
      if (currentTrack) setPaused(!userPaused);
    });

    function updatePlayer() {
      const el = currentTrack ? currentTrack.el : null;
      const dur = el && isFinite(el.duration) ? el.duration : 0;

      if (dur !== lastDuration) {
        lastDuration = dur;
        seek.max = dur;
        seek.disabled = dur === 0;
        volumeSlider.disabled = dur === 0;
        playBtn.disabled = dur === 0;
        timeTotal.textContent = fmtTime(dur);
        playerEl.classList.toggle("empty", dur === 0);
      }

      if (!scrubbing) {
        const now = el ? el.currentTime : 0;
        seek.value = now;
        timeNow.textContent = fmtTime(now);
      }

      const pct = dur ? (parseFloat(seek.value) / dur) * 100 : 0;
      playerEl.style.setProperty("--pct", pct.toFixed(2) + "%");
    }

    ITEMS.forEach((item) => {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.style.setProperty("--c", item.color);
      cell.innerHTML = '<span class="node"><span class="ring"></span><span class="disc"></span></span>';
      cell.querySelector(".disc").textContent = item.label;

      const setHover = () => {
        let targetSource = item;
        if (item.bookmarks && item.bookmarks.length > 0) {
          if (!randomHoverCache.has(item.id)) {
            const randomIndex = Math.floor(Math.random() * item.bookmarks.length);
            randomHoverCache.set(item.id, item.bookmarks[randomIndex]);
          }
          targetSource = randomHoverCache.get(item.id);
        }
        hover = { src: targetSource, owner: item };
        apply();
      };

      const clearHover = () => {
        randomHoverCache.delete(item.id);
        if (hover && hover.owner === item) { hover = null; apply(); }
      };

      cell.addEventListener("mouseenter", setHover);
      cell.addEventListener("mouseleave", clearHover);
      cell.addEventListener("focus", setHover);
      cell.addEventListener("blur", clearHover);
      cell.addEventListener("click", () => {
        unlockAudio();
        openPanel(item);
      });

      container.appendChild(cell);

      nodes.push({
        item,
        cell,
        disc: cell.querySelector(".disc"),
        ring: cell.querySelector(".ring"),
        active: false,
        amp: 0,
        angle: 0,
        rest: 0
      });
    });

    function setPanelText(title, text) {
      drawerTitle.textContent = title || "";
      drawerBody.textContent = text || "";
    }

    function renderTabs(item) {
      bookmarkContainer.innerHTML = "";
      (item.bookmarks || []).forEach((bm) => {
        const btn = document.createElement("button");
        btn.className = "bookmark-item";
        btn.style.setProperty("--accent", bm.color);
        btn.innerHTML = '<span class="label"></span>';
        const labelEl = btn.querySelector(".label");
        labelEl.textContent = bm.label;
        labelEl.dataset.label = bm.label;

        btn.addEventListener("mouseenter", () => { hover = { src: bm, owner: selectedItem }; apply(); });
        btn.addEventListener("mouseleave", () => { if (hover && hover.src === bm) { hover = null; apply(); } });

        btn.addEventListener("click", () => {
          unlockAudio();
          selectedTab = bm;
          if (userPaused) setPaused(false);
          bookmarkContainer.querySelectorAll(".bookmark-item").forEach((b) => b.classList.toggle("selected", b === btn));
          setPanelText(bm.title, bm.text || bm.sentence);
          apply();
        });

        bookmarkContainer.appendChild(btn);
      });
    }

    function measureTabs() {
      let max = 0;
      bookmarkContainer.querySelectorAll(".bookmark-item").forEach((b) => {
        max = Math.max(max, b.offsetWidth);
      });
      document.documentElement.style.setProperty("--tab-w", (max + 12) + "px");
    }

    function openPanel(item) {
      selectedItem = item;
      selectedTab = null;
      if (userPaused) setPaused(false);
      renderTabs(item);
      measureTabs();
      setPanelText(item.detailsTitle, item.detailsText);
      drawer.style.setProperty("--tab-count", (item.bookmarks || []).length);
      drawer.inert = false;
      drawer.classList.add("open");
      appLayout.classList.add("drawer-open");
      apply();
    }

    function closePanel() {
      userPaused = false;
      syncPlayButton();
      selectedItem = null;
      selectedTab = null;
      hover = null;
      drawer.classList.remove("open");
      appLayout.classList.remove("drawer-open");
      drawer.inert = true;
      apply();
    }

    closeDrawerBtn.addEventListener("click", closePanel);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

    let level = 0;
    let playAmp = 1;
    let lastTime = performance.now();

    function readLevel() {
      if (userPaused) {
        level += (0 - level) * 0.15;
        return level;
      }

      const tr = currentTrack;
      let raw = 0;

      if (tr && tr.analyser && !tr.el.paused && audioCtx && audioCtx.state === "running") {
        tr.analyser.getByteTimeDomainData(tr.timeData);
        let sumSq = 0;
        for (let i = 0; i < tr.timeData.length; i++) {
          const norm = (tr.timeData[i] - 128) / 128;
          sumSq += norm * norm;
        }
        const rms = Math.sqrt(sumSq / tr.timeData.length);

        tr.analyser.getByteFrequencyData(tr.freqData);
        let bassSum = 0;
        for (let i = 1; i <= 12; i++) bassSum += tr.freqData[i];
        const bass = (bassSum / 12) / 255;

        const volScale = Math.max(0.25, tr.el.volume);
        const combined = ((rms * 3.2) + (bass * 0.85)) / volScale;
        raw = Math.min(1, Math.pow(Math.max(0, combined - 0.12), 1.35));
      }

      level += (raw - level) * (raw > level ? 0.85 : 0.22);
      return level;
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const lvl = readLevel();
      playAmp += ((userPaused ? 0 : 1) - playAmp) * Math.min(1, dt * 6);
      updatePlayer();
      let maxAmp = 0;

      nodes.forEach((n) => {
        n.amp += ((n.active ? 1 : 0) - n.amp) * Math.min(1, dt * 8);
        if (!n.active && n.amp < 0.001) n.amp = 0;
        maxAmp = Math.max(maxAmp, n.amp);

        if (n.active) {
          n.rest = null;
          n.angle += dt * (1.4 + lvl * 2.8) * n.amp * SPIN * playAmp;
        } else {
          if (n.rest === null) n.rest = Math.ceil(n.angle / TAU) * TAU;
          n.angle += (n.rest - n.angle) * Math.min(1, dt * 5);
          if (Math.abs(n.rest - n.angle) < 0.002) { n.angle = 0; n.rest = 0; }
        }
        n.disc.style.transform = `rotate(${n.angle.toFixed(3)}rad)`;

        n.ring.style.opacity = n.amp.toFixed(3);
        n.ring.style.transform = `scale(${(1 + n.amp * (0.015 + lvl * BOUNCE)).toFixed(3)})`;
      });

      noteEl.style.transform = `scale(${(1 + maxAmp * lvl * 0.22).toFixed(3)})`;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>

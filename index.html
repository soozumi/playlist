<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>yora's playlist</title>

  <!-- Kosugi Maru (needs an internet connection the first time) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #e4e4e4;
      --ink: #222;
      --panel-bg: #fafafa;
      --board-bg: #2d2d2d;
      --font: "Kosugi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;

      --board: min(560px, 92vw);                 /* the dark board; everything on it scales from this */
      --panel-w: clamp(320px, 36vw, 560px);
      --rail-w: 7rem;                            /* room for the side tabs (the open tab sticks out the furthest) */
      --tab-w: 4.9rem;                           /* closed tab */
      --tab-w-open: 7rem;                        /* open tab */
    }

    /* keep the board on screen on short windows too */
    @supports (height: 100svh) {
      :root { --board: max(290px, min(560px, 92vw, calc(100svh - 280px))); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100svh;
      transition: background-color 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: none; }
    }

    /* canvas for background effects (floating hearts); sits behind all the content */
    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- page layout ---------- */

    .app-layout {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      transition: padding-right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* when the panel is open, the board + header re-centre in the space that's left */
    .app-layout.drawer-open {
      padding-right: calc(var(--panel-w) + var(--rail-w));
    }

    .main-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1rem;
    }

    #note {
      font-size: 3.6rem;
      line-height: 1;
      color: #000;
      user-select: none;
      will-change: transform;
    }

    #sentence-display {
      min-height: 3.1rem;
      max-width: min(30rem, 92vw);
      margin-top: 0.5rem;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.4;
      color: rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    body.night #note { color: #fff; }
    body.night #sentence-display { color: rgba(255, 255, 255, 0.78); }
    #note, #sentence-display { transition: color 0.8s ease, opacity 0.4s ease, transform 0.4s ease; }

    #sentence-display.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---------- the board: four disks + volume ---------- */

    .board {
      width: var(--board);
      padding: calc(var(--board) * 0.07);
      padding-bottom: calc(var(--board) * 0.055);
      background: var(--board-bg);
      border-radius: calc(var(--board) * 0.11);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.16);
      overflow: hidden;              /* the bouncing rings stay inside the board */
    }

    .disk-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: calc(var(--board) * 0.015);
    }

    /*
      .cell  = fixed hit area (never moves, so hover doesn't flicker while a disk spins)
      .node  = holds the ring + the disk, grows a little when active
      .ring  = pale outline that bounces with the music
      .disc  = the coloured disk (spun from JS)
    */
    .cell {
      --c-dark: color-mix(in srgb, var(--c) 55%, #000);   /* resting outline (ITEMS can override with `dark`) */
      --c-pale: color-mix(in srgb, var(--c) 22%, #fff);   /* light outline when hovered / open */
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      font: inherit;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .cell.active { z-index: 1; }       /* an active disk's ring slides behind its neighbours */

    .node {
      position: relative;
      width: 82%;
      aspect-ratio: 1;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cell.active .node { transform: scale(1.08); }

    .ring {
      position: absolute;
      inset: -3%;
      border-radius: 50%;
      background: var(--c-pale);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .disc {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
      padding-top: 15%;
      border-radius: 50%;
      background: var(--c);
      border: clamp(2px, calc(var(--board) * 0.0075), 4px) solid var(--c-dark);
      color: #fff;
      font-size: clamp(0.9rem, calc(var(--board) * 0.04), 1.3rem);
      text-transform: lowercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
      will-change: transform;
      transition: border-color 0.25s ease;
    }

    /* the hole in the middle of the disk */
    .disc::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--board-bg);
      border: clamp(2px, calc(var(--board) * 0.006), 3px) solid var(--c-dark);
      transition: border-color 0.25s ease;
    }

    /* hovered / open: outline goes light, label goes bold */
    .cell.active .disc { border-color: var(--c-pale); font-weight: 700; }
    .cell.active .disc::after { border-color: var(--c-pale); }

    /* volume, on the board */
    .volume {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-top: calc(var(--board) * 0.03);
      padding: 0 0.3rem;
    }

    .volume svg {
      width: 1.6rem;
      height: 1.6rem;
      fill: #fff;
      flex: none;
    }

    #volume {
      --vol-pct: 85%;
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 0;
      height: 36px;
      background: transparent;
      outline: none;
      cursor: pointer;
      touch-action: pan-y;
    }

    #volume::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(to right, #fff var(--vol-pct), #000 var(--vol-pct));
    }
    #volume::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(to right, #fff var(--vol-pct), #000 var(--vol-pct));
    }

    /* chunky grip with three lines */
    #volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      box-sizing: border-box;
      width: 30px;
      height: 26px;
      margin-top: -9px;
      border: 3px solid #7a7a7a;
      border-radius: 4px;
      background-color: #d9d9d9;
      background-image: linear-gradient(#555, #555), linear-gradient(#555, #555), linear-gradient(#555, #555);
      background-size: 2px 12px;
      background-position: 6px 50%, 11px 50%, 16px 50%;
      background-repeat: no-repeat;
    }
    #volume::-moz-range-thumb {
      box-sizing: border-box;
      width: 30px;
      height: 26px;
      border: 3px solid #7a7a7a;
      border-radius: 4px;
      background-color: #d9d9d9;
      background-image: linear-gradient(#555, #555), linear-gradient(#555, #555), linear-gradient(#555, #555);
      background-size: 2px 12px;
      background-position: 6px 50%, 11px 50%, 16px 50%;
      background-repeat: no-repeat;
    }
    #volume:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4); }

    /* ---------- side panel: [tabs][panel] ---------- */

    .slide-drawer {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translate(calc(100% + 3rem), -50%);
      display: flex;
      align-items: stretch;          /* the panel grows with the tabs */
      z-index: 100;
      filter: drop-shadow(-8px 0 18px rgba(0, 0, 0, 0.07));
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide-drawer.open { transform: translate(0, -50%); }

    /* the tab rail is part of the layout, so more tabs = a taller panel */
    .rail {
      flex: none;
      width: var(--rail-w);
      margin: 1.9rem 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;         /* tabs sit flush against the panel, no gaps between them */
    }

    .tab {
      --tab-bg: color-mix(in srgb, var(--accent) 28%, #fff);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 0;
      --under: 3.2rem;                         /* how far the tab tucks beneath the panel */
      width: calc(var(--tab-w) + var(--under));
      margin-right: calc(var(--under) * -1);
      min-height: 5.5rem;
      padding: 0.95rem calc(0.5rem + var(--under)) 0.95rem 0.5rem;
      border: 0;
      border-radius: 1.3rem 0 0 1.3rem;
      background: var(--tab-bg);
      color: var(--ink);
      font-size: 0.88rem;
      line-height: 1.25;
      text-transform: lowercase;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  min-height 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  background-color 0.2s ease,
                  color 0.2s ease;
    }

    .tab .flip { display: block; }

    /* closed tab: text runs sideways, bottom to top; long names wrap into columns */
    .tab .label {
      display: block;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      max-height: 4.6rem;
      text-align: center;
    }

    /* open tab: flips to horizontal, wider and taller than the rest */
    .tab.selected {
      width: calc(var(--tab-w-open) + var(--under));
      min-height: 8.8rem;
    }

    .tab.selected .label {
      writing-mode: horizontal-tb;
      transform: none;
      max-height: none;
    }

    .tab:focus-visible { outline: 2px solid rgba(0, 0, 0, 0.35); outline-offset: -3px; }

    @media (hover: hover) {
      .tab:hover { transform: translateX(-0.45rem); }
    }

    .panel {
      position: relative;
      z-index: 1;                    /* sits over the tabs' tucked-in ends */
      flex: none;
      width: var(--panel-w);
      min-height: 16rem;
      padding: 2.6rem 2.6rem 1.8rem 2.6rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--panel-bg);
      border-radius: 4.5rem 0 0 4.5rem;
    }

    /* the two little ears on top of the panel */
    .panel::before,
    .panel::after {
      content: "";
      position: absolute;
      top: -39px;
      width: 68px;
      height: 40px;
      background: var(--panel-bg);
      clip-path: path("M0 40 C7 24 15 8 26 3 Q34 -1 42 3 C53 8 61 24 68 40 Z");
      pointer-events: none;
    }
    .panel::before { left: 12.2rem; }
    .panel::after  { left: 19.4rem; }

    .close {
      position: absolute;
      top: 1rem;
      right: 1.1rem;
      width: 2rem;
      height: 2rem;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      color: #777;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .close:hover { background: rgba(0, 0, 0, 0.1); }

    /* the song's description is the only text in the panel */
    .desc {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: pre-line;
      font-size: clamp(1.15rem, 1.7vw, 1.6rem);
      line-height: 1.35;
      color: #222;
    }

    /* ---------- player (play / pause + scrubber) ---------- */

    .player {
      --seek-color: #555;
      --pct: 0%;
      flex: none;
      width: 100%;
    }

    .play-btn {
      display: grid;
      place-items: center;
      width: 3.4rem;
      height: 3.4rem;
      margin: 0 auto 0.5rem;
      border: 0;
      border-radius: 50%;
      background: none;
      color: #5a5a5a;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .play-btn:hover:not(:disabled) { transform: scale(1.08); }
    .play-btn:active:not(:disabled) { transform: scale(0.94); }
    .play-btn:disabled { opacity: 0.35; cursor: default; }
    .play-btn:focus-visible { outline: 2px solid #999; outline-offset: 2px; }

    .play-btn svg { width: 2.3rem; height: 2.3rem; fill: currentColor; grid-area: 1 / 1; }
    .play-btn .icon-play { display: none; transform: translateX(2px); }
    .play-btn.is-paused .icon-play { display: block; }
    .play-btn.is-paused .icon-pause { display: none; }

    #seek {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 24px;
      background: transparent;
      outline: none;
      cursor: pointer;
      touch-action: pan-y;
    }

    #seek::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--pct), #e0e0e0 var(--pct));
    }
    #seek::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--seek-color) var(--pct), #e0e0e0 var(--pct));
    }

    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -5px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--seek-color);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    #seek::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--seek-color);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    #seek:disabled { cursor: default; opacity: 0.4; }

    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 0.1rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: #666;
    }
    .player.empty .times { opacity: 0.4; }

    /* ---------- phones / narrow windows: the panel drops in under the board ---------- */

    @media (max-width: 860px) {
      :root { --rail-w: 6rem; --tab-w: 4.4rem; --tab-w-open: 6rem; }

      .app-layout { flex-direction: column; }
      .app-layout.drawer-open { padding-right: 0; }
      .main-content { flex: none; padding: 1.25rem 1rem 1rem; }

      .slide-drawer {
        position: relative;
        top: auto;
        right: auto;
        transform: none;
        display: none;
        width: calc(100% - 0.6rem);
        margin: 2.6rem 0 2rem auto;
        transition: none;
      }
      .slide-drawer.open { display: flex; transform: none; animation: rise 0.45s cubic-bezier(0.22, 1, 0.36, 1); }

      .panel {
        flex: 1;
        width: auto;
        min-width: 0;
        min-height: 14rem;
        padding: 2.2rem 1.3rem 1.4rem 1.6rem;
        border-radius: 3.2rem 0 0 3.2rem;
      }
      .panel::before { left: 5.2rem; }
      .panel::after  { left: 10.4rem; }

      .desc { font-size: 1.1rem; }
      .tab { font-size: 0.82rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .node, .tab, .slide-drawer { transition: none; }
    }
  </style>
</head>
<body>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="app-layout" id="app-layout">
    <div class="main-content">
      <div class="hero">
        <div id="note" aria-hidden="true">♫</div>
        <div id="sentence-display" aria-live="polite"></div>
      </div>

      <section class="board" aria-label="Moods">
        <div class="disk-grid" id="button-container"></div>

        <div class="volume">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" aria-label="Volume" />
        </div>
      </section>
    </div>

    <aside class="slide-drawer" id="slide-drawer" aria-label="Now playing">
      <div class="rail" id="bookmark-container"></div>

      <div class="panel">
        <button class="close" id="close-drawer" aria-label="Close panel">×</button>

        <p class="desc" id="drawer-body"></p>

        <div class="player empty" id="player">
          <button class="play-btn" id="play-toggle" aria-label="Pause" disabled>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="5" width="4.2" height="14" rx="1.2" />
              <rect x="13.8" y="5" width="4.2" height="14" rx="1.2" />
            </svg>
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
            </svg>
          </button>
          <input type="range" id="seek" min="0" max="0" step="any" value="0" disabled aria-label="Song position" />
          <div class="times">
            <span id="time-now">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>

      Per disk:  dark = the resting outline colour of the disk

      {
        id: "battle",
        label: "battle",
        color: "#b05a56",
        dark: "#8d2a27",
        sentence: "let's make al qaeda look like a birthday party!",
        audio: "",
        bookmarks: [
          {
            id: "battle-sub-1",
            label: "Explosion",
            color: "#c9736b",
            sentence: "If only she was a better student...",
            audio: "/audio/Five.mp3",
            text: "The wind just blew through her hair as she stares down are her opponent... this is their big day. THEY'RE ABOUT TO CATCH THEIR FIRST BODY!"
          }
        ]
      }
    ];

    /* ---------- elements ---------- */
    const BASE_BG = "#e4e4e4";
    const appLayout = document.getElementById("app-layout");
    const container = document.getElementById("button-container");
    const sentenceEl = document.getElementById("sentence-display");
    const noteEl = document.getElementById("note");
    const drawer = document.getElementById("slide-drawer");
    const rail = document.getElementById("bookmark-container");
    const descEl = document.getElementById("drawer-body");
    const closeDrawerBtn = document.getElementById("close-drawer");
    const playerEl = document.getElementById("player");
    const seek = document.getElementById("seek");
    const volumeSlider = document.getElementById("volume");
    const timeNow = document.getElementById("time-now");
    const timeTotal = document.getElementById("time-total");
    const playBtn = document.getElementById("play-toggle");

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const stackedQuery = window.matchMedia("(max-width: 860px)");
    const SPIN = reduceMotion ? 0 : 1;
    const TAU = Math.PI * 2;
    const BOUNCE = reduceMotion ? 0 : 1.0;

    drawer.inert = true;

    /* ---------- state ---------- */
    let selectedItem = null;   // the disk whose panel is open
    let selectedTab = null;    // the song open in the panel
    let hover = null;          // { src, owner } = what the pointer / keyboard is on right now
    let userPaused = false;
    let currentVolume = 0.85;
    let fxMode = null;         // background effect of whatever is active, e.g. "hearts"
    const randomHoverCache = new Map();
    const tabEls = [];

    const tint = (c) => `color-mix(in srgb, ${c} 28%, ${BASE_BG})`;

    function resolveTarget() {
      if (hover) return hover;
      if (selectedTab) return { src: selectedTab, owner: selectedItem };
      if (selectedItem) return { src: selectedItem, owner: selectedItem };
      return null;
    }

    /* ---------- audio ---------- */
    const tracks = new Map();
    let currentTrack = null;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function getTrack(url) {
      if (!url) return null;
      if (tracks.has(url)) return tracks.get(url);

      const el = new Audio();
      if (/^https?:\/\//i.test(url)) {
        el.crossOrigin = "anonymous";
      }
      el.loop = false;            // not looping, so 'ended' can move on to the next song
      el.volume = 0;
      el.preload = "auto";
      el.src = url;

      // when a song ends, go on to the next tab of the open disk
      el.addEventListener("ended", () => {
        const list = selectedItem && selectedItem.bookmarks;
        if (!list || list.length === 0) return;

        const i = Math.max(0, list.indexOf(selectedTab));
        const next = list[(i + 1) % list.length];
        const nextTrack = getTrack(next.audio);

        if (nextTrack === tracks.get(url)) {            // only one song: start it again
          el.currentTime = 0;
          el.play().catch(() => {});
          return;
        }
        if (nextTrack) nextTrack.el.currentTime = 0;
        selectTab(next);
      });

      const track = { el, analyser: null, timeData: null, freqData: null, connected: false };
      tracks.set(url, track);
      return track;
    }

    function ensureAnalyser(track) {
      if (!track || track.connected) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const source = ctx.createMediaElementSource(track.el);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.15;
        source.connect(analyser);
        analyser.connect(ctx.destination);
        track.analyser = analyser;
        track.timeData = new Uint8Array(analyser.fftSize);
        track.freqData = new Uint8Array(analyser.frequencyBinCount);
        track.connected = true;
      } catch (e) {
        track.connected = true;
      }
    }

    function fadeAudio(audio, targetVolume, duration = 250) {
      if (!audio) return;
      clearInterval(audio._fadeInterval);

      const finalTarget = userPaused ? 0 : targetVolume;
      const steps = 12;
      const stepTime = duration / steps;
      const volumeStep = (finalTarget - audio.volume) / steps;

      if (finalTarget > 0 && audio.paused) {
        audio.play().catch(() => {});
      }

      audio._fadeInterval = setInterval(() => {
        const nextVol = Math.min(1, Math.max(0, audio.volume + volumeStep));
        audio.volume = nextVol;

        if (Math.abs(finalTarget - nextVol) < 0.03) {
          audio.volume = finalTarget;
          clearInterval(audio._fadeInterval);
          if (finalTarget === 0) {
            audio.pause();
            if (!selectedItem) audio.currentTime = 0;   // keep the spot while the panel is open
          }
        }
      }, stepTime);
    }

    function setTrack(track) {
      if (track === currentTrack) {
        if (track) ensureAnalyser(track);
        return;
      }
      tracks.forEach((t) => { if (t !== track) fadeAudio(t.el, 0, 250); });
      currentTrack = track;
      if (track) {
        ensureAnalyser(track);
        if (!userPaused) fadeAudio(track.el, currentVolume, 250);
      }
    }

    // browsers only allow sound after a tap / click / key press
    function unlockAudio() {
      getAudioContext();
      if (currentTrack) {
        ensureAnalyser(currentTrack);
        if (currentTrack.el.paused && !userPaused) {
          fadeAudio(currentTrack.el, currentVolume, 250);
        }
      }
    }
    window.addEventListener("pointerdown", unlockAudio, { passive: true });
    window.addEventListener("keydown", unlockAudio, { passive: true });

    /* ---------- scene: background, sentence, description, audio, active disk ---------- */
    const nodes = [];

    function apply() {
      const t = resolveTarget();
      document.body.style.backgroundColor = t ? (t.src.bg || tint(t.src.color)) : BASE_BG;

      const nextFx = (t && t.src.effect) || null;
      if (nextFx === "hearts" && fxMode !== "hearts") seedHearts();   // start with a scattering, not an empty sky
      fxMode = nextFx;
      document.body.classList.toggle("night", !!(t && t.src.night));

      if (t) {
        sentenceEl.textContent = t.src.sentence;
        sentenceEl.classList.add("visible");
      } else {
        sentenceEl.classList.remove("visible");
      }

      // the panel only shows the description of whichever song is playing
      if (selectedItem) {
        const src = t ? t.src : (selectedTab || selectedItem);
        descEl.textContent = (src && src.text) || "";
      }

      nodes.forEach((n) => {
        n.active = !!t && t.owner === n.item;
        n.cell.classList.toggle("active", n.active);
      });

      // light up the tab you're pointing at (the dark hover look also works for keyboard + touch)
      tabEls.forEach(({ bm, btn }) => {
        btn.dataset.hover = hover && hover.src === bm ? "1" : "0";
      });

      if (t) playerEl.style.setProperty("--seek-color", `color-mix(in srgb, ${t.src.color} 55%, #555)`);

      setTrack(t ? getTrack(t.src.audio) : null);
    }

    /* ---------- scrubber + play / pause ---------- */
    let scrubbing = false;
    let lastDuration = -1;

    function fmtTime(s) {
      s = Math.max(0, Math.floor(s || 0));
      const m = Math.floor(s / 60);
      const sec = String(s % 60).padStart(2, "0");
      return `${m}:${sec}`;
    }

    seek.addEventListener("input", () => {
      scrubbing = true;
      const t = parseFloat(seek.value);
      timeNow.textContent = fmtTime(t);
      if (currentTrack) currentTrack.el.currentTime = t;
    });
    seek.addEventListener("change", () => { scrubbing = false; });
    window.addEventListener("pointerup", () => { scrubbing = false; });

    volumeSlider.addEventListener("input", (e) => {
      currentVolume = parseFloat(e.target.value);
      if (currentTrack && !userPaused) {
        currentTrack.el.volume = currentVolume;
      }
      volumeSlider.style.setProperty("--vol-pct", (currentVolume * 100).toFixed(0) + "%");
    });

    function syncPlayButton() {
      playBtn.classList.toggle("is-paused", userPaused);
      playBtn.setAttribute("aria-label", userPaused ? "Play" : "Pause");
    }

    function setPaused(p) {
      userPaused = p;
      syncPlayButton();
      if (currentTrack) fadeAudio(currentTrack.el, p ? 0 : currentVolume, p ? 200 : 250);
    }

    playBtn.addEventListener("click", () => {
      if (currentTrack) setPaused(!userPaused);
    });

    function updatePlayer() {
      const el = currentTrack ? currentTrack.el : null;
      const dur = el && isFinite(el.duration) ? el.duration : 0;

      if (dur !== lastDuration) {
        lastDuration = dur;
        seek.max = dur;
        seek.disabled = dur === 0;
        playBtn.disabled = dur === 0;
        timeTotal.textContent = fmtTime(dur);
        playerEl.classList.toggle("empty", dur === 0);
      }

      if (!scrubbing) {
        const now = el ? el.currentTime : 0;
        seek.value = now;
        timeNow.textContent = fmtTime(now);
      }

      const pct = dur ? (parseFloat(seek.value) / dur) * 100 : 0;
      playerEl.style.setProperty("--pct", pct.toFixed(2) + "%");
    }

    /* ---------- the four disks ---------- */
    function randomSong(item) {
      const withAudio = (item.bookmarks || []).filter((b) => b.audio);
      const pool = withAudio.length ? withAudio : (item.bookmarks || []);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // pointing at a disk picks one of its songs at random and plays it
    function hoverDisk(item) {
      let src = item;
      if (item.bookmarks && item.bookmarks.length > 0) {
        if (!randomHoverCache.has(item.id)) randomHoverCache.set(item.id, randomSong(item));
        src = randomHoverCache.get(item.id);
      }
      hover = { src, owner: item };
      apply();
    }

    function unhoverDisk(item) {
      randomHoverCache.delete(item.id);
      if (hover && hover.owner === item) { hover = null; apply(); }
    }

    ITEMS.forEach((item) => {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.style.setProperty("--c", item.color);
      if (item.dark) cell.style.setProperty("--c-dark", item.dark);
      cell.innerHTML = '<span class="node"><span class="ring"></span><span class="disc"></span></span>';
      cell.querySelector(".disc").textContent = item.label;

      cell.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") hoverDisk(item); });
      cell.addEventListener("pointerleave", () => unhoverDisk(item));
      cell.addEventListener("focus", () => { if (cell.matches(":focus-visible")) hoverDisk(item); });
      cell.addEventListener("blur", () => unhoverDisk(item));

      // clicking opens the song that is playing right now
      cell.addEventListener("click", () => {
        unlockAudio();
        if (!(hover && hover.owner === item)) {          // touch: there was no hover, so pick now
          randomHoverCache.delete(item.id);
          hoverDisk(item);
        }
        const song = hover && hover.src !== item ? hover.src : null;
        openPanel(item, song);
      });

      container.appendChild(cell);

      nodes.push({
        item,
        cell,
        disc: cell.querySelector(".disc"),
        ring: cell.querySelector(".ring"),
        active: false,
        amp: 0,
        angle: 0,
        rest: 0
      });
    });

    /* ---------- side tabs ---------- */
    // closed tab -> open tab: the label turns from vertical to horizontal
    function flip(btn, toOpen) {
      if (reduceMotion || !btn.animate) return;
      btn.querySelector(".flip").animate(
        [{ transform: toOpen ? "rotate(-90deg)" : "rotate(90deg)" }, { transform: "rotate(0deg)" }],
        { duration: 450, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
      );
    }

    function selectTab(bm) {
      selectedTab = bm;
      hover = null;
      tabEls.forEach(({ bm: b, btn }) => {
        const on = b === bm;
        if (btn.classList.contains("selected") !== on) {
          btn.classList.toggle("selected", on);
          flip(btn, on);
        }
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (userPaused) setPaused(false);
      apply();
    }

    function renderTabs(item) {
      rail.innerHTML = "";
      tabEls.length = 0;

      (item.bookmarks || []).forEach((bm) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (bm === selectedTab ? " selected" : "");
        btn.style.setProperty("--accent", bm.color);
        btn.setAttribute("aria-pressed", bm === selectedTab ? "true" : "false");
        btn.innerHTML = '<span class="flip"><span class="label"></span></span>';
        btn.querySelector(".label").textContent = bm.label;

        const on = () => { hover = { src: bm, owner: selectedItem }; apply(); };
        const off = () => { if (hover && hover.src === bm) { hover = null; apply(); } };

        btn.addEventListener("pointerenter", (e) => { if (e.pointerType !== "touch") on(); });
        btn.addEventListener("pointerleave", off);
        btn.addEventListener("focus", () => { if (btn.matches(":focus-visible")) on(); });
        btn.addEventListener("blur", off);
        btn.addEventListener("click", () => { unlockAudio(); selectTab(bm); });

        rail.appendChild(btn);
        tabEls.push({ bm, btn });
      });
    }

    function openPanel(item, song) {
      selectedItem = item;
      selectedTab = song || null;
      hover = null;
      if (userPaused) setPaused(false);
      renderTabs(item);
      drawer.inert = false;
      drawer.classList.add("open");
      appLayout.classList.add("drawer-open");
      apply();

      if (stackedQuery.matches) {          // phones: the panel sits under the board, so bring it into view
        setTimeout(() => drawer.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }), 80);
      }
    }

    function closePanel() {
      userPaused = false;
      syncPlayButton();
      selectedItem = null;
      selectedTab = null;
      hover = null;
      tabEls.length = 0;
      drawer.classList.remove("open");
      appLayout.classList.remove("drawer-open");
      drawer.inert = true;
      apply();
    }

    closeDrawerBtn.addEventListener("click", closePanel);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

    /* ---------- floating hearts (any song with effect: "hearts") ---------- */
    const fxCanvas = document.getElementById("fx");
    const fxCtx = fxCanvas.getContext("2d");
    const HEART_COLORS = ["#c96192"];
    const hearts = [];
    let fxAmp = 0;             // eases 0 -> 1 while hearts are on, so they fade in and out instead of popping
    let fxW = 0, fxH = 0;
    let spawnCarry = 0;
    let fxDirty = false;

    function resizeFx() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxW = window.innerWidth;
      fxH = window.innerHeight;
      fxCanvas.width = Math.round(fxW * dpr);
      fxCanvas.height = Math.round(fxH * dpr);
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeFx();
    window.addEventListener("resize", resizeFx);

    // how many hearts should be on screen (more on bigger screens)
    const heartTarget = () => Math.min(70, Math.max(28, (fxW * fxH) / 20000));

    function spawnHeart(age = 0) {
      const life = 7 + Math.random() * 6;
      hearts.push({
        x: Math.random() * fxW,
        y: Math.random() * fxH,
        size: 9 + Math.random() * 14,                  // tiny: roughly 9-23px wide
        age: Math.min(age, life * 0.7),
        life,
        vy: -(10 + Math.random() * 22),                // drifts upward, px per second
        sway: 10 + Math.random() * 22,                 // side-to-side wobble, px
        swayFreq: 0.5 + Math.random() * 0.8,
        phase: Math.random() * TAU,
        rot: (Math.random() - 0.5) * 0.6,
        rotSpeed: (Math.random() - 0.5) * 0.5,
        color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
        peak: 0.6 + Math.random() * 0.35               // how opaque this one gets
      });
    }

    function seedHearts() {
      // top up to ~60% of the target (sweeping the mouse across tabs shouldn't pile up extra hearts)
      const n = Math.round(heartTarget() * 0.6) - hearts.length;
      for (let i = 0; i < n; i++) spawnHeart(Math.random() * 6);
    }

    function drawHeart(ctx, size) {
      // Two round lobes on a tilted square, with the bottom point softened.
      const d = size / 2.5;                  // half-diagonal of the square
      const r = d / Math.SQRT2;              // lobe radius
      const cr = d * 0.4;                    // how rounded the bottom tip is
      ctx.translate(0, d * 0.1);             // nudge so the heart is centred on its position
      ctx.beginPath();
      ctx.moveTo(d / 2, d / 2);
      ctx.arcTo(0, d, -d / 2, d / 2, cr);    // rounded bottom tip
      ctx.lineTo(-d, 0);
      ctx.arc(-d / 2, -d / 2, r, Math.PI * 0.75, Math.PI * 1.75);
      ctx.arc(d / 2, -d / 2, r, Math.PI * 1.25, Math.PI * 2.25);
      ctx.closePath();
      ctx.fill();
    }

    /* ---- stars (effect: "stars"): fixed little points that twinkle, like looking up at the night sky ---- */
    const STAR_COLORS = ["#ffffff", "#fff4d6", "#d8e4ff"];
    let stars = [];
    let starAmp = 0;
    let fxT = 0;

    function makeStars() {
      const n = Math.round(Math.min(260, Math.max(90, (fxW * fxH) / 4500)));
      stars = [];
      for (let i = 0; i < n; i++) {
        const big = Math.random() < 0.08;
        stars.push({
          x: Math.random(),                                  // stored as fractions of the screen so resizing keeps them in place
          y: Math.random(),
          r: big ? 1.5 + Math.random() * 0.8 : 0.5 + Math.random() * 0.9,
          base: big ? 1 : 0.5 + Math.random() * 0.5,
          speed: 0.6 + Math.random() * 2.2,
          phase: Math.random() * TAU,
          glow: big,
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)]
        });
      }
    }
    makeStars();

    function drawStars() {
      for (const st of stars) {
        const tw = reduceMotion ? 0.85 : 0.6 + 0.4 * Math.sin(fxT * st.speed + st.phase);
        const a = st.base * tw * starAmp;
        const x = st.x * fxW, y = st.y * fxH;
        fxCtx.fillStyle = st.color;
        if (st.glow) {
          fxCtx.globalAlpha = a * 0.22;
          fxCtx.beginPath(); fxCtx.arc(x, y, st.r * 3.4, 0, TAU); fxCtx.fill();
        }
        fxCtx.globalAlpha = a;
        fxCtx.beginPath(); fxCtx.arc(x, y, st.r, 0, TAU); fxCtx.fill();
      }
      fxCtx.globalAlpha = 1;
    }

    function updateFx(dt) {
      fxAmp += ((fxMode === "hearts" ? 1 : 0) - fxAmp) * Math.min(1, dt * 2.5);
      if (fxAmp < 0.002) fxAmp = 0;
      starAmp += ((fxMode === "stars" ? 1 : 0) - starAmp) * Math.min(1, dt * 1.8);
      if (starAmp < 0.002) starAmp = 0;
      fxT += dt;

      if (fxMode === "hearts") {
        spawnCarry += dt * (heartTarget() / 9);        // average heart lives about 9 seconds
        while (spawnCarry >= 1) {
          spawnCarry -= 1;
          if (hearts.length < heartTarget()) spawnHeart();
        }
      }

      // nothing visible: clear once, then do no work at all
      if (fxAmp === 0 && starAmp === 0 && !fxMode) {
        hearts.length = 0;
        if (fxDirty) { fxCtx.clearRect(0, 0, fxW, fxH); fxDirty = false; }
        return;
      }
      if (fxAmp === 0 && fxMode !== "hearts") hearts.length = 0;

      const m = reduceMotion ? 0 : 1;                  // reduced motion: hearts fade in place instead of drifting
      fxCtx.clearRect(0, 0, fxW, fxH);
      fxDirty = true;

      if (starAmp > 0) drawStars();

      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        h.age += dt;
        if (h.age >= h.life) { hearts.splice(i, 1); continue; }

        const t = h.age / h.life;
        const env = Math.min(1, t / 0.2, (1 - t) / 0.3);          // fade in, hold, fade out
        const x = h.x + Math.sin(h.phase + h.age * h.swayFreq) * h.sway * m;
        const y = h.y + h.vy * h.age * m;

        fxCtx.save();
        fxCtx.translate(x, y);
        fxCtx.rotate(h.rot + h.rotSpeed * h.age * m);
        fxCtx.globalAlpha = h.peak * env * fxAmp;
        fxCtx.fillStyle = h.color;
        drawHeart(fxCtx, h.size);
        fxCtx.restore();
      }
    }

    /* ---------- animation loop: spinning disks + beat-reactive rings ---------- */
    let level = 0;
    let playAmp = 1;
    let lastTime = performance.now();

    function readLevel() {
      if (userPaused) {
        level += (0 - level) * 0.15;
        return level;
      }

      const tr = currentTrack;
      let raw = 0;

      if (tr && tr.analyser && !tr.el.paused && audioCtx && audioCtx.state === "running") {
        tr.analyser.getByteTimeDomainData(tr.timeData);
        let sumSq = 0;
        for (let i = 0; i < tr.timeData.length; i++) {
          const norm = (tr.timeData[i] - 128) / 128;
          sumSq += norm * norm;
        }
        const rms = Math.sqrt(sumSq / tr.timeData.length);

        tr.analyser.getByteFrequencyData(tr.freqData);
        let bassSum = 0;
        for (let i = 1; i <= 12; i++) bassSum += tr.freqData[i];
        const bass = (bassSum / 12) / 255;

        const volScale = Math.max(0.25, tr.el.volume);
        const combined = ((rms * 3.2) + (bass * 0.85)) / volScale;
        raw = Math.min(1, Math.pow(Math.max(0, combined - 0.08), 1.2));
      }

      level += (raw - level) * (raw > level ? 0.85 : 0.22);
      return level;
    }

    function frame(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const lvl = readLevel();
      playAmp += ((userPaused ? 0 : 1) - playAmp) * Math.min(1, dt * 6);
      updatePlayer();
      updateFx(dt);
      let maxAmp = 0;

      nodes.forEach((n) => {
        n.amp += ((n.active ? 1 : 0) - n.amp) * Math.min(1, dt * 8);
        if (!n.active && n.amp < 0.001) n.amp = 0;
        maxAmp = Math.max(maxAmp, n.amp);

        if (n.active) {
          n.rest = null;
          n.angle += dt * (1.4 + lvl * 2.8) * n.amp * SPIN * playAmp;
        } else {
          if (n.rest === null) n.rest = Math.ceil(n.angle / TAU) * TAU;
          n.angle += (n.rest - n.angle) * Math.min(1, dt * 5);
          if (Math.abs(n.rest - n.angle) < 0.002) { n.angle = 0; n.rest = 0; }
        }
        n.disc.style.transform = `rotate(${n.angle.toFixed(3)}rad)`;

        n.ring.style.opacity = n.amp.toFixed(3);
        n.ring.style.transform = `scale(${Math.min(1.36, 1 + n.amp * (0.02 + lvl * BOUNCE)).toFixed(3)})`;
      });

      noteEl.style.transform = `scale(${(1 + maxAmp * lvl * 0.22).toFixed(3)})`;

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
